<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hôm Nay Ăn Gì?</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #18233a 0%, #080b12 45%, #05070b 100%);
            color: white;
            min-height: 100vh;
        }

        /* ================= HEADER ================= */

        header {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(5, 8, 15, 0.8);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: #ffb52e;
        }

        .header-info {
            color: #9ca8bb;
            font-size: 14px;
        }

        /* ================= MAIN ================= */

        main {
            width: min(1200px, 92%);
            margin: auto;
            padding: 55px 0 80px;
        }

        .hero {
            text-align: center;
            margin-bottom: 35px;
        }

        .hero h1 {
            font-size: clamp(35px, 6vw, 65px);
            margin-bottom: 12px;
        }

        .hero h1 span {
            color: #ffb52e;
        }

        .hero p {
            color: #9da8ba;
            font-size: 16px;
        }

        /* ================= CASE ================= */

        .case-box {
            position: relative;
            background: rgba(13, 18, 29, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 30px;
            box-shadow:
                0 25px 80px rgba(0,0,0,0.5),
                inset 0 0 50px rgba(255,181,46,0.02);
        }

        .roulette {
            position: relative;
            height: 210px;
            overflow: hidden;
            border-radius: 12px;
            background: #090c13;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* Vạch chính giữa */

        .pointer {
            position: absolute;
            z-index: 10;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: #ffb52e;
            box-shadow:
                0 0 10px #ffb52e,
                0 0 25px rgba(255,181,46,0.8);
        }

        .pointer::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid #ffb52e;
        }

        .pointer::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 15px solid #ffb52e;
        }

        .items-track {
            position: absolute;
            height: 100%;
            display: flex;
            align-items: center;
            left: 0;
            top: 0;
            will-change: transform;
        }

        .food-card {
            flex: 0 0 165px;
            height: 170px;
            margin: 0 7px;
            background: #111722;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .food-card img {
            width: 100%;
            height: 105px;
            object-fit: cover;
            display: block;
        }

        .food-info {
            padding: 8px 10px;
        }

        .food-name {
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .food-price {
            margin-top: 4px;
            color: #ffb52e;
            font-size: 13px;
            font-weight: 700;
        }

        /* ================= BUTTON ================= */

        .spin-area {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }

        #spinBtn {
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            
            border: none;
            cursor: pointer;
            padding: 16px 50px;
            border-radius: 9px;
            background: linear-gradient(135deg, #ffcf58, #ff9f00);
            color: #171006;
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 1px;
            box-shadow:
                0 8px 25px rgba(255, 170, 20, 0.25);
            transition: 0.2s;
        }

        #spinBtn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 12px 30px rgba(255, 170, 20, 0.4);
        }

        #spinBtn:active {
            transform: scale(0.97);
        }

        #spinBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ================= RESULT ================= */

        .result {
            min-height: 90px;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .result-title {
            color: #8e9aaf;
            font-size: 14px;
        }

        .result-name {
            font-size: 30px;
            font-weight: 900;
            color: #ffb52e;
            margin-top: 5px;
        }

        .result-price {
            color: #d5dbea;
            margin-top: 5px;
        }

        /* ================= FOOD LIST ================= */

        .section-title {
            margin-top: 55px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title h2 {
            font-size: 22px;
        }

        .food-count {
            color: #7f8ba0;
            font-size: 14px;
        }

        .food-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 16px;
        }

        .list-card {
            background: rgba(16, 22, 34, 0.9);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            overflow: hidden;
            transition: 0.2s;
        }

        .list-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255,181,46,0.35);
        }

        .list-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
        }

        .list-content {
            padding: 13px;
        }

        .list-name {
            font-weight: 700;
        }

        .list-price {
            color: #ffb52e;
            font-size: 14px;
            margin-top: 5px;
        }

        .delete-btn {
            width: 100%;
            margin-top: 10px;
            padding: 7px;
            border: none;
            border-radius: 6px;
            background: rgba(255,70,70,0.1);
            color: #ff7070;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: rgba(255,70,70,0.2);
        }

        /* ================= MOBILE ================= */

        @media (max-width: 800px) {

            .case-box {
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .add-btn {
                padding: 13px;
            }

            .roulette {
                height: 190px;
            }

            .food-card {
                flex-basis: 145px;
                height: 155px;
            }

            .food-card img {
                height: 95px;
            }
        }
    </style>
</head>

];

    /*
       DỮ LIỆU HIỆN TẠI
       Danh sách món ăn lấy trực tiếp từ defaultFoods.
       Muốn cập nhật cho tất cả người dùng: sửa defaultFoods
       trên GitHub rồi Commit.
     */

    const foods = defaultFoods;


    // FORMAT TIỀN


    function formatPrice(price) {

        return new Intl.NumberFormat("vi-VN").format(price) + "đ";

    }


    // Hiển thị danh sách:

    function renderFoodList() {

        const list = document.getElementById("foodList");

        list.innerHTML = "";

        foods.forEach((food) => {

            const card = document.createElement("div");

            card.className = "list-card";

            card.innerHTML = `

                <img
                    src="${food.image}"
                    alt="${food.name}"
                    onerror="this.src='https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=800&q=80'"
                >

                <div class="list-content">

                    <div class="list-name">
                        ${food.name}
                    </div>

                    <div class="list-price">
                        ${formatPrice(food.price)}
                    </div>


                </div>
            `;

            list.appendChild(card);

        });

        document.getElementById("foodCount").textContent =
            `${foods.length} món`;

    }


    // TẠO BĂNG QUAY
    

    const track = document.getElementById("itemsTrack");

    function createTrack() {

        track.innerHTML = "";


        /*
            Nhân nhiều lần danh sách để tạo cảm giác
            case opening chạy liên tục.
        */

        const repeatedFoods = [];

        for (let i = 0; i < 12; i++) {

            foods.forEach(food => {

                repeatedFoods.push(food);

            });

        }


        repeatedFoods.forEach(food => {

            const card = document.createElement("div");

            card.className = "food-card";

            card.innerHTML = `

                <img
                    src="${food.image}"
                    alt="${food.name}"
                    onerror="this.src='https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=800&q=80'"
                >

                <div class="food-info">

                    <div class="food-name">
                        ${food.name}
                    </div>

                    <div class="food-price">
                        ${formatPrice(food.price)}
                    </div>

                </div>

            `;

            track.appendChild(card);

        });

    }


    /* =====================================================
       RANDOM / CASE OPENING
       ===================================================== */

    let spinning = false;


    function spin() {

        if (spinning) return;

        if (foods.length < 2) {

            alert("Cần ít nhất 2 món!");

            return;
        }


        spinning = true;

        const button =
            document.getElementById("spinBtn");

        button.disabled = true;

        button.textContent = "🎰 ĐANG MỞ...";


        /*
            Chọn món ngẫu nhiên.
        */

        const winnerIndex =
            Math.floor(Math.random() * foods.length);

        const winner =
            foods[winnerIndex];


        /*
            Kích thước mỗi card.
        */

        // Lấy đúng card thắng trên màn hình hiện tại
        const roulette = document.querySelector(".roulette");
        const rouletteWidth = roulette.offsetWidth;
        
        const middleIndex =
            foods.length * 7 + winnerIndex;
        
        const cards =
            track.querySelectorAll(".food-card");
        
        const winnerCard =
            cards[middleIndex];
        
        // Tính tâm thực tế của card thắng
        const cardCenter =
            winnerCard.offsetLeft +
            winnerCard.offsetWidth / 2;
        
        // Đưa tâm card thắng vào chính giữa vòng quay
        const target =
            cardCenter -
            rouletteWidth / 2;
        
        // Reset animation

        track.style.transition = "none";

        track.style.transform = "translateX(0px)";

        /*
            Force browser reflow.
        */

        void track.offsetWidth;


        /*
            Quay nhiều vòng rồi dừng.
        */

        track.style.transition =
            "transform 5s cubic-bezier(0.12, 0.8, 0.18, 1)";

        track.style.transform =
            `translateX(-${target}px)`;


    /*
        Hiển thị kết quả sau khi animation kết thúc.
    */

        setTimeout(() => {

            document.getElementById("resultName")
                .textContent = winner.name;

            document.getElementById("resultPrice")
                .textContent =
                "💰 " + formatPrice(winner.price);


            button.disabled = false;

            button.textContent = "🎰 MỞ HÒM";

            spinning = false;

        }, 5100);

    }

    // EVENT

    document
        .getElementById("spinBtn")
        .addEventListener("click", spin);


    // KHỞI TẠO


    renderFoodList();

    createTrack();

</script>
